name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      RATE_LIMIT_WRITES: "100000"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      # A real browser for the end-to-end and accessibility tests. The system
      # packages come from a mirror that sometimes stalls or refuses, so try
      # three times, then fall back to the browser alone (the runner image
      # already has the libraries Chromium needs).
      - name: Install the test browser
        run: |
          for attempt in 1 2 3; do
            timeout 240 uv run playwright install --with-deps chromium && exit 0
            echo "attempt $attempt stalled or failed; retrying in 15 seconds"
            sleep 15
          done
          echo "system packages unavailable; installing the browser only"
          uv run playwright install chromium
      - run: uv run pytest -q
